name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar APK
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PL=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          mkdir -p res/drawable obj out
          cp img1.webp img2.webp res/drawable/
          $BT/aapt2 compile --dir res -o res.zip
          $BT/aapt2 link -o base.apk -I $PL --manifest AndroidManifest.xml --java gen res.zip --min-sdk-version 21 --target-sdk-version 33
          javac -source 8 -target 8 -classpath $PL -d obj MainActivity.java gen/com/mini/toggle/R.java
          $BT/d8 --release --min-api 21 --lib $PL --output out $(find obj -name '*.class')
          zip -j base.apk out/classes.dex
          $BT/zipalign -f 4 base.apk aligned.apk
          keytool -genkeypair -keystore k.jks -alias a -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Toggle"
          $BT/apksigner sign --ks k.jks --ks-pass pass:123456 --out toggle.apk aligned.apk
          ls -l toggle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: toggle-apk
          path: toggle.apk
          
